<!doctype html>
<html lang="ja">
  <head>
    <base target="_top">
    <meta charset="utf-8">

    <meta name="theme-color" content="#f5f6f3">
    <title>シフト管理</title>
    <style>
      
      
      :root {
        color-scheme: light;
        --color-paper: oklch(97% 0.012 145);

        --color-focus: oklch(48% 0.12 235);

        --space-8: 2rem;
        --space-10: 2.5rem;
        --space-12: 3rem;

      }
      @supports not (color: oklch(0 0 0)) {
        :root {
          --color-paper: #f5f6f3;
          --color-paper-2: #ecefeb;

          --color-surface-2: #f8faf8;
          --color-ink: #202a25;
          --color-ink-2: #58645d;
          --color-rule: #d9e0da;
          --color-accent: #245c48;
          --color-accent-strong: #174633;
          --color-accent-ink: #fff;
          --color-accent-soft: #e9f1ec;
          --color-focus: #335e93;
          --color-fixed: #f2e8c9;
          --color-fixed-ink: #654b17;
          --color-warning: #77511d;
          --color-warning-soft: #fbf4e2;
          --color-danger: #923c32;
          --color-danger-soft: #fbefec;
          --color-success: #245c48;
          --color-success-soft: #e9f1ec;

          --color-backdrop: rgba(27, 40, 33, .38);

      }
      * { box-sizing: border-box; }
      html, body { min-width: 320px; max-width: 100%; overflow-x: clip; }

      :focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }

      .topbar { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: 12px 0; border-bottom: var(--rule-subtle); background: var(--color-paper); }

      .activity-label { max-width: 15ch; overflow: hidden; text-overflow: ellipsis; }

      .period span:nth-child(2) { color: var(--color-ink-2); font-weight: 400; }

      .button { display: inline-flex; min-width: 0; min-height: 44px; align-items: center; justify-content: center; padding: 10px 14px; border: var(--rule-subtle); border-radius: var(--radius-control); background: var(--color-surface); color: var(--color-ink); font-size: var(--text-sm); font-weight: 650; line-height: 1.25; text-align: center; white-space: nowrap; }
      .button.primary { border-color: var(--color-accent); background: var(--color-accent); color: var(--color-accent-ink); }

      .filters.info-filters { max-width: 420px; grid-template-columns: minmax(0, 1fr); }
      .shift-card { padding: var(--space-4) 0; margin: 0; border: 0; border-top: var(--rule-subtle); background: transparent; }
      .shift-card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-3); }
      .person-name { font-size: var(--text-md); font-weight: 700; }

      .badge { display: inline-flex; min-height: 26px; align-items: center; padding: 3px 8px; border: var(--rule-subtle); border-radius: var(--radius-tight); background: var(--color-paper); color: var(--color-ink-2); font-size: var(--text-xs); font-weight: 700; white-space: nowrap; }
      .badge.fixed { border-color: var(--color-fixed-ink); background: var(--color-fixed); color: var(--color-fixed-ink); }
      .shift-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); }

      .shift-history-actions .button.danger { grid-column: 1 / -1; }
      .grid-help { margin: 0 0 var(--space-3); }
      .table-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3); margin: 0 0 var(--space-3); }
      .table-toolbar-info { min-width: 0; flex: 1 1 160px; }

      .table-toolbar-actions { display: flex; min-width: 0; flex: 1 1 260px; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: var(--space-2); }
      .table-toolbar-actions > .button { flex: 0 1 auto; }
      .table-toolbar .template-actions { margin: 0; padding: 0 10px; border: var(--rule-subtle); border-radius: var(--radius-control); background: var(--color-surface); }
      .table-toolbar .template-actions summary { display: flex; align-items: center; min-height: 44px; padding: 0; white-space: nowrap; }
      .table-toolbar .template-actions-list { min-width: min(240px, calc(100vw - 48px)); }
      .shift-grid-scroll { width: 100%; max-height: min(68dvh, 720px); overflow: auto; border: var(--rule-subtle); border-radius: var(--radius-tight); background: var(--color-surface); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
      .shift-grid { width: 100%; min-width: 0; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
      .shift-grid th, .shift-grid td { position: relative; height: 36px; padding: 0; border-right: 1px solid var(--color-rule); border-bottom: 1px solid var(--color-rule); text-align: center; }
      .shift-grid thead th { position: sticky; top: 0; z-index: 2; height: 32px; overflow: hidden; background: var(--color-paper-2); color: var(--color-ink); font-family: var(--font-mono); font-size: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .shift-grid thead th > span { display: inline-block; transform: scaleX(.84); }
      .shift-grid thead th > .print-date { display: none; }
      .shift-grid .employee-head, .shift-grid .employee-cell { width: clamp(56px, 16vw, 148px); position: sticky; left: 0; text-align: left; }
      .shift-grid .employee-head { z-index: 4; padding: 0 5px; background: var(--color-paper-2); font-family: var(--font-body); font-size: var(--text-xs); }

      .grid-cell-button { position: relative; display: block; width: 100%; min-width: 0; min-height: 35px; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--color-ink); font-family: var(--font-mono); font-size: 8px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1; text-align: center; white-space: nowrap; }
      .grid-cell-button.empty { color: var(--color-ink-2); }

      .editor-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(82px, .65fr) 44px; align-items: end; gap: 8px; padding: var(--space-3) 0; border-top: var(--rule-subtle); }

    <script>
      var state = null;
      var drafts = null;
      var activePage = "shift";
      var infoMode = "requests";
      var settingsMode = "period";
      var selectedGridCell = null;
      var selectedRequestMonth = "";
      var busy = false;
      var keepNoticeOnLoad = false;
      var fixedUndoStack = [];
      var fixedRedoStack = [];
      var mutationQueue = [];
      var mutationInFlight = false;
      var mutationSequence = 0;
      var fixedHistorySequence = 0;
      var refreshBarrierRequested = false;
      var refreshBarrierInFlight = false;

      var refreshBarrierPreserveNotice = true;
      var draftDirty = { settings: false, employees: false, jobs: false, categories: false, quotas: false };
      var draftRevision = { settings: 0, employees: 0, jobs: 0, categories: 0, quotas: 0 };

      var main = document.getElementById("main");
      var notice = document.getElementById("notice");
      var periodLabel = document.getElementById("period-label");

      function element(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function makeButton(text, className, action, disabled) {
        var node = element("button", "button" + (className ? " " + className : ""), text);
        node.type = "button";
        node.disabled = !!disabled;

      function field(labelText, control) {

        wrap.appendChild(element("span", "", labelText));
        wrap.appendChild(control);
        return wrap;
      }

      function inputControl(type, value, min, max) {
        var input = document.createElement("input");
        input.className = "control";
        input.type = type;

      function selectControl(options, value) {

      function setBusy(value, label) {

      function updateActivityIndicator_(loadLabel) {

        var active = busy || mutationInFlight || pendingCount > 0 || refreshBarrierRequested || refreshBarrierInFlight || refreshBarrierBlocked;
        if (activity && activityLabel) {
          activity.hidden = !active;
          if (refreshBarrierInFlight || (refreshBarrierRequested && !mutationInFlight)) {
            activityLabel.textContent = "最新状態を同期中…";

            activityLabel.textContent = "最新状態の再取得待ち";
          } else if (busy) {

            var current = mutationQueue.find(function(item) { return !item.skipRequest; });

      function makeRunner(onSuccess, onFailure) {
        return google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(onFailure);
      }

      function dispatch(runner, method, payload) {

          case "apiGenerateShift": runner.apiGenerateShift(); break;
          case "apiPrepareShiftTemplate": runner.apiPrepareShiftTemplate(); break;
          case "apiPrepareQuotaTemplate": runner.apiPrepareQuotaTemplate(); break;
          case "apiSaveShiftCell": runner.apiSaveShiftCell(payload); break;
          case "apiFixShiftCell": runner.apiFixShiftCell(payload); break;
          case "apiUnfixShiftCell": runner.apiUnfixShiftCell(payload); break;
          case "apiUnfixAllShiftCells": runner.apiUnfixAllShiftCells(payload); break;
          case "apiApplyFixedStateTransaction": runner.apiApplyFixedStateTransaction(payload); break;
          case "apiSaveShiftSettings": runner.apiSaveShiftSettings(payload); break;
          case "apiSaveEmployees": runner.apiSaveEmployees(payload); break;
          case "apiSaveJobs": runner.apiSaveJobs(payload); break;
          case "apiSaveCategories": runner.apiSaveCategories(payload); break;
          case "apiSaveQuotas": runner.apiSaveQuotas(payload); break;
          default: throw new Error("呼び出し先が不明です。");
        }
      }

      function setShiftCellLocally(payload, updates) {
        if (!state || !payload || !payload.employeeName || !payload.date) return null;
        var row = state.shift.rows.find(function(item) { return item.name === payload.employeeName; });
        var dateIndex = state.shift.dates.findIndex(function(item) { return item.iso === payload.date; });
        if (!row || dateIndex < 0 || !Array.isArray(row.cells)) return null;
        var cell = row.cells[dateIndex];
        if (!cell) {
          cell = { value: "", fixed: false };
          row.cells[dateIndex] = cell;
        }
        var previousCell = Object.assign({}, cell);
        Object.assign(cell, updates);
        return function() { row.cells[dateIndex] = previousCell; };
      }

      function getFixedCellsFromState() {
        var cells = [];
        if (!state || !state.shift) return cells;
        state.shift.rows.forEach(function(row) {
          row.cells.forEach(function(cell, dateIndex) {
            if (cell && cell.fixed && state.shift.dates[dateIndex]) {
              cells.push({ employeeName: row.name, date: state.shift.dates[dateIndex].iso });
            }
          });
        });
        return cells;
      }

      function getShiftCellLocalState_(employeeName, date) {
        if (!state || !state.shift) return null;
        var row = state.shift.rows.find(function(item) { return item.name === employeeName; });
        var dateIndex = state.shift.dates.findIndex(function(item) { return item.iso === date; });
        if (!row || dateIndex < 0 || !Array.isArray(row.cells)) return null;

        if (!cell) return { value: "", fixed: false };
        return { value: String(cell.value || ""), fixed: cell.fixed === true };

      function cloneQueuePayload_(payload) {
        if (payload === undefined) return undefined;
        return JSON.parse(JSON.stringify(payload));
      }

      function cloneDrafts_(value) {

      function makeFixedHistoryEntry(changes, label, id) {
        return {
          id: id || ("fixed-history-" + (++fixedHistorySequence)),

              date: change.date,
              beforeFixed: change.beforeFixed === true,
              afterFixed: change.afterFixed === true

      }

      function snapshotFixedHistory_() {
        return { undo: fixedUndoStack.slice(), redo: fixedRedoStack.slice() };
      }

      function restoreFixedHistory_(snapshot) {
        if (!snapshot) return;

      function pushFixedHistoryImmediately_(entry) {

        item.optimisticMutation = null;
        item.historySnapshot = null;
        item.skipRequest = false;
        item.refreshAfterSuccess = false;

        if (item.kind === "fixed-set") {
          item.historySnapshot = snapshotFixedHistory_();
          var local = getShiftCellLocalState_(item.employeeName, item.date);
          if (!local || local.fixed === item.targetFixed || (item.targetFixed && !local.value)) {
            item.skipRequest = true;
            return;
          }
          item.method = item.targetFixed ? "apiFixShiftCell" : "apiUnfixShiftCell";
          item.payload = {
            employeeName: item.employeeName,
            date: item.date,
            expectedFixed: local.fixed
          };
          item.optimisticMutation = applyOptimisticMutation(item.method, item.payload);
          var fixedEntry = makeFixedHistoryEntry([{
            employeeName: item.employeeName,
            date: item.date,
            beforeFixed: local.fixed,
            afterFixed: item.targetFixed
          }], item.targetFixed ? "固定" : "固定解除", item.historyEntryId);
          item.historyEntryId = fixedEntry.id;
          pushFixedHistoryImmediately_(fixedEntry);
          return;
        }

        if (item.kind === "unfix-all") {
          item.historySnapshot = snapshotFixedHistory_();
          var fixedCells = getFixedCellsFromState();
          item.method = "apiUnfixAllShiftCells";
          item.payload = {
            cells: fixedCells.map(function(cell) {
              return { employeeName: cell.employeeName, date: cell.date, expectedFixed: true };
            })
          };
          item.optimisticMutation = applyOptimisticMutation(item.method, item.payload);
          if (fixedCells.length) {
            var clearEntry = makeFixedHistoryEntry(fixedCells.map(function(cell) {
              return {
                employeeName: cell.employeeName,
                date: cell.date,
                beforeFixed: true,
                afterFixed: false
              };
            }), "固定をすべて解除", item.historyEntryId);
            item.historyEntryId = clearEntry.id;
            pushFixedHistoryImmediately_(clearEntry);
          }
          return;
        }

        if (item.kind === "undo" || item.kind === "redo") {
          item.historySnapshot = snapshotFixedHistory_();
          var source = item.kind === "undo" ? fixedUndoStack : fixedRedoStack;
          var target = item.kind === "undo" ? fixedRedoStack : fixedUndoStack;
          var entry = source.length ? source[source.length - 1] : null;
          if (!entry || entry.id !== item.historyEntryId) {
            item.skipRequest = true;
            return;
          }
          if (!allFixedChangesMatchLocal_(entry.changes, item.kind === "undo")) {
            item.skipRequest = true;
            return;
          }
          item.method = "apiApplyFixedStateTransaction";
          item.payload = {
            changes: entry.changes.map(function(change) {
              return {
                employeeName: change.employeeName,
                date: change.date,
                expectedFixed: item.kind === "undo" ? change.afterFixed : change.beforeFixed,
                targetFixed: item.kind === "undo" ? change.beforeFixed : change.afterFixed
              };
            })
          };
          item.optimisticMutation = applyOptimisticMutation(item.method, item.payload);
          source.pop();
          target.push(entry);
          return;
        }

        item.optimisticMutation = applyOptimisticMutation(item.method, item.payload);
        item.refreshAfterSuccess = !item.optimisticMutation || item.optimisticMutation.refreshAfterSuccess === true;
      }

      function rollbackQueuedMutation_(item) {
        if (item.optimisticMutation && typeof item.optimisticMutation.rollback === "function") {
          item.optimisticMutation.rollback();
        }
        restoreFixedHistory_(item.historySnapshot);
        item.optimisticMutation = null;
        item.historySnapshot = null;
      }

      function rollbackPendingMutations_() {
        for (var index = mutationQueue.length - 1; index >= 0; index--) {
          rollbackQueuedMutation_(mutationQueue[index]);
        }
      }

      function replayPendingMutations_() {
        mutationQueue.forEach(function(item) {
          applyQueuedMutationOptimistically_(item);
        });
      }

      function renderPreservingCellEditor_() {
        var sheet = document.querySelector(".cell-sheet");
        var cellEditor = null;
        if (sheet && selectedGridCell) {
          var select = sheet.querySelector("select.control");
          if (select) {
            cellEditor = {
              employeeName: selectedGridCell.employeeName,
              date: selectedGridCell.date,
              value: select.value
            };
          }
        }
        render();
        if (!cellEditor || !selectedGridCell || selectedGridCell.employeeName !== cellEditor.employeeName || selectedGridCell.date !== cellEditor.date) return;
        var nextSheet = document.querySelector(".cell-sheet");
        var nextSelect = nextSheet && nextSheet.querySelector("select.control");
        if (nextSelect && Array.from(nextSelect.options).some(function(option) { return option.value === cellEditor.value; })) {
          nextSelect.value = cellEditor.value;
        }
      }

      function runFixedCellMutation(employeeName, date, beforeFixed, afterFixed, successMessage, busyMessage) {
        runMutation(afterFixed ? "apiFixShiftCell" : "apiUnfixShiftCell", {
          employeeName: employeeName,
          date: date,
          expectedFixed: beforeFixed === true
        }, successMessage, busyMessage, {
          kind: "fixed-set",
          employeeName: employeeName,
          date: date,
          targetFixed: afterFixed === true
        });
      }

      function unfixAllShiftCells() {
        var fixedCells = getFixedCellsFromState();
        if (!fixedCells.length) {
          runMutation("apiUnfixAllShiftCells", { cells: [] }, function(result) {
            return result && result.count ? result.count + "件の固定を解除しました。" : "固定中のセルはありません。";
          }, "固定状態を確認中…", { kind: "unfix-all" });
          return;
        }
        if (!window.confirm("固定中のセルが" + fixedCells.length + "件あります。固定マークだけをすべて解除します。セルの値は変更しません。続けますか？")) return;
        runMutation("apiUnfixAllShiftCells", { cells: [] }, function(result) {
          var count = result && typeof result.count === "number" ? result.count : fixedCells.length;
          return count + "件の固定を解除しました。";
        }, "固定を一括解除中…", {
          kind: "unfix-all"
        });
      }

      function runFixedHistory(direction) {
        var source = direction === "undo" ? fixedUndoStack : fixedRedoStack;
        if (!source.length) return;
        var entry = source[source.length - 1];
        runMutation("apiApplyFixedStateTransaction", { changes: [] },
          direction === "undo" ? "固定操作を一つ前に戻しました。" : "固定操作を一つ次に進めました。",
          direction === "undo" ? "一つ前に戻しています…" : "一つ次に進めています…",
          { kind: direction, historyEntryId: entry.id });
      }

      function renderFixedHistoryActions() {
        var actions = element("div", "shift-history-actions");
        var undo = makeButton("← 一つ前に戻す", "small", function() { runFixedHistory("undo"); }, fixedUndoStack.length === 0);
        undo.setAttribute("aria-label", fixedUndoStack.length ? "固定操作を一つ前に戻す" : "一つ前に戻せる固定操作はありません");
        var redo = makeButton("一つ次に進む →", "small", function() { runFixedHistory("redo"); }, fixedRedoStack.length === 0);
        redo.setAttribute("aria-label", fixedRedoStack.length ? "固定操作を一つ次に進める" : "一つ次に進める固定操作はありません");
        var fixedCount = getFixedCellsFromState().length;
        var clear = makeButton("固定をすべて解除", "danger small", unfixAllShiftCells, false);
        clear.setAttribute("aria-label", "固定中の" + fixedCount + "件をすべて解除");
        actions.appendChild(undo);
        actions.appendChild(redo);
        actions.appendChild(clear);
        return actions;
      }

      function applyOptimisticMutation(method, payload) {
        if (!state) return null;
        var rollbackActions = [];
        var refreshAfterSuccess = false;
        function replaceStateValue(key, value) {
          var previous = state[key];
          state[key] = value;
          rollbackActions.push(function() { state[key] = previous; });
        }

        if (method === "apiSaveShiftCell") {
          var cellRollback = setShiftCellLocally(payload, { value: String(payload.value || "") });
          if (cellRollback) rollbackActions.push(cellRollback);
        } else if (method === "apiFixShiftCell" || method === "apiUnfixShiftCell") {
          var fixedRollback = setShiftCellLocally(payload, { fixed: method === "apiFixShiftCell" });
          if (fixedRollback) rollbackActions.push(fixedRollback);
        } else if (method === "apiUnfixAllShiftCells") {
          (payload.cells || []).forEach(function(cell) {
            var unfixRollback = setShiftCellLocally(cell, { fixed: false });
            if (unfixRollback) rollbackActions.push(unfixRollback);
          });
        } else if (method === "apiApplyFixedStateTransaction") {
          (payload.changes || []).forEach(function(change) {
            var historyRollback = setShiftCellLocally(change, { fixed: change.targetFixed === true });
            if (historyRollback) rollbackActions.push(historyRollback);
          });
        } else if (method === "apiSaveShiftSettings") {
          replaceStateValue("settings", Object.assign({}, state.settings, {
            startDate: String(payload.startDate || ""),
            endDate: String(payload.endDate || ""),
            intervalDays: Number(payload.intervalDays),
            holidays: Array.from(new Set(payload.holidays || [])).sort()
          }));
          refreshAfterSuccess = true;
        } else if (method === "apiSaveEmployees") {
          replaceStateValue("employees", (payload || []).map(function(item) {
            return { name: String(item.name || "").trim(), group: String(item.group || ""), must: item.must === true };
          }));
          refreshAfterSuccess = true;
        } else if (method === "apiSaveJobs") {
          replaceStateValue("jobs", (payload || []).map(function(item) { return String(item || "").trim(); }));
        } else if (method === "apiSaveCategories") {
          var nextCategories = (payload || []).map(function(item) {
            return { job: String(item.job || "").trim(), category: String(item.category || "") };
          }).filter(function(item) { return item.job !== ""; });
          state.jobs.forEach(function(job) {
            if (!nextCategories.some(function(item) { return item.job === job; })) nextCategories.push({ job: job, category: "" });
          });
          replaceStateValue("categories", nextCategories);
        } else if (method === "apiSaveQuotas") {
          replaceStateValue("quotas", (payload || []).map(function(item) {
            return { workDays: String(item.workDays || ""), primary: String(item.primary || ""), secondary: String(item.secondary || "") };
          }));
        }

        if (!rollbackActions.length) return null;
        return {
          rollback: function() { rollbackActions.slice().reverse().forEach(function(action) { action(); }); },
          refreshAfterSuccess: refreshAfterSuccess
        };
      }

      function loadState(preserveNotice) {
        if (state) {
          requestRefreshBarrier_(preserveNotice);
          return;
        }
        if (busy) return;
        if (!preserveNotice) setNotice("", "");
        setBusy(true, "読み込み中…");
        var loading = element("div", "loading", "読み込み中…");
        loading.setAttribute("role", "status");
        main.replaceChildren(loading);
        var runner = makeRunner(function(result) {
          if (!result || result.ok !== true) {
            setBusy(false);
            setNotice(result && result.message ? result.message : "データを読み込めませんでした。", "error");
            main.replaceChildren(element("div", "empty", "Spreadsheetを開けません。接続設定とGoogleアカウントの権限を確認してください。"));
            return;
          }
          state = result.data;
          drafts = createDrafts(state);
          resetDraftTracking_();
          periodLabel.textContent = formatPeriod(state.settings.startDate, state.settings.endDate);
          render();
          setBusy(false);
          if (!preserveNotice) setNotice("", "");
          processMutationQueue_();
        }, function(error) {
          setBusy(false);
          console.error(error);
          setNotice("データを読み込めませんでした。Spreadsheetの接続設定と権限を確認してください。", "error");
          main.replaceChildren(element("div", "empty", "再読み込みしても解決しない場合は、管理者に確認してください。"));
          processMutationQueue_();
        });
        runner.apiGetAppData();
      }

      function resetDraftTracking_() {
        Object.keys(draftDirty).forEach(function(section) {
          draftDirty[section] = false;
          draftRevision[section] = 0;
        });
      }

      function markDraftDirty_(section) {
        if (!Object.prototype.hasOwnProperty.call(draftDirty, section)) return;
        draftDirty[section] = true;
        draftRevision[section] += 1;
      }

      function trackDraftEdits_(container, section) {
        container.addEventListener("input", function() { markDraftDirty_(section); });
        container.addEventListener("change", function() { markDraftDirty_(section); });
      }

      function draftSectionForMethod_(method) {
        if (method === "apiSaveShiftSettings") return "settings";
        if (method === "apiSaveEmployees") return "employees";
        if (method === "apiSaveJobs") return "jobs";
        if (method === "apiSaveCategories") return "categories";
        if (method === "apiSaveQuotas") return "quotas";
        return "";
      }

      function hasPendingDraftSave_(section) {
        return mutationQueue.some(function(item) {
          return !item.skipRequest && item.draftSection === section;
        });
      }

      function mergeDraftsAfterRefresh_(freshState, previousDrafts) {
        var next = createDrafts(freshState);
        if (!previousDrafts) return next;
        Object.keys(draftDirty).forEach(function(section) {
          if (draftDirty[section] || hasPendingDraftSave_(section)) {
            next[section] = cloneQueuePayload_(previousDrafts[section]);
          }
        });
        return next;
      }

      function markDraftSaveSucceeded_(item) {
        if (item.draftSection && draftRevision[item.draftSection] === item.draftRevision) {
          draftDirty[item.draftSection] = false;
        }
      }

      function requestRefreshBarrier_(preserveNotice) {
        if (!state) {
          loadState(preserveNotice);
          return;
        }
        if (!refreshBarrierRequested && !refreshBarrierInFlight) {
          refreshBarrierPreserveNotice = !!preserveNotice;
        } else {
          refreshBarrierPreserveNotice = refreshBarrierPreserveNotice && !!preserveNotice;
        }
        refreshBarrierRequested = true;
        refreshBarrierBlocked = false;
        updateActivityIndicator_();
        processMutationQueue_();
      }

      function startRefreshBarrier_() {
        if (busy || mutationInFlight || refreshBarrierInFlight || !refreshBarrierRequested) return;
        refreshBarrierRequested = false;
        refreshBarrierInFlight = true;
        refreshBarrierBlocked = false;
        var preserveNotice = refreshBarrierPreserveNotice;
        refreshBarrierPreserveNotice = true;
        updateActivityIndicator_();

        var runner = makeRunner(function(result) {
          if (!result || result.ok !== true) {
            refreshBarrierInFlight = false;
            refreshBarrierBlocked = true;
            setNotice((result && result.message ? result.message : "最新状態を再取得できませんでした。") + " 後続の更新は送信していません。画面の楽観表示は保持しています。再読み込みして同期してください。", "error");
            updateActivityIndicator_();
            return;
          }

          var previousDrafts = cloneDrafts_(drafts);
          rollbackPendingMutations_();
          state = result.data;
          drafts = mergeDraftsAfterRefresh_(state, previousDrafts);
          replayPendingMutations_();

          refreshBarrierInFlight = false;
          refreshBarrierBlocked = false;
          periodLabel.textContent = formatPeriod(state.settings.startDate, state.settings.endDate);
          renderPreservingCellEditor_();
          if (!preserveNotice) setNotice("", "");
          updateActivityIndicator_();
          processMutationQueue_();
        }, function(error) {
          refreshBarrierInFlight = false;
          refreshBarrierBlocked = true;
          console.error(error);
          setNotice("最新状態を再取得できなかったため、後続の更新は送信していません。画面の楽観表示は保持しています。通信状態を確認して再読み込みしてください。", "error");
          updateActivityIndicator_();
        });
        runner.apiGetAppData();
      }

      function mutationSuccessMessage_(item, data) {
        if (typeof item.successMessage === "function") return item.successMessage(data);
        return item.successMessage || "保存しました。";
      }

      function runMutation(method, payload, successMessage, busyMessage, options) {
        options = options || {};
        var item = {
          id: ++mutationSequence,
          kind: options.kind || "generic",
          method: method,
          payload: cloneQueuePayload_(payload),
          successMessage: successMessage,
          busyMessage: busyMessage || "保存中…",
          employeeName: options.employeeName || "",
          date: options.date || "",
          targetFixed: options.targetFixed === true,
          historyEntryId: options.historyEntryId || "",
          draftSection: draftSectionForMethod_(method),
          draftRevision: 0,
          optimisticMutation: null,
          historySnapshot: null,
          skipRequest: false,
          refreshAfterSuccess: false
        };
        if (item.draftSection) item.draftRevision = draftRevision[item.draftSection];
        mutationQueue.push(item);
        applyQueuedMutationOptimistically_(item);
        if (state && (item.optimisticMutation || item.historySnapshot)) renderPreservingCellEditor_();
        updateActivityIndicator_();
        processMutationQueue_();
      }

      function processMutationQueue_() {
        if (busy || mutationInFlight || refreshBarrierInFlight) {
          updateActivityIndicator_();
          return;
        }
        if (refreshBarrierRequested) {
          startRefreshBarrier_();
          return;
        }
        if (refreshBarrierBlocked) {
          updateActivityIndicator_();
          return;
        }

        while (mutationQueue.length && mutationQueue[0].skipRequest) {
          mutationQueue.shift();
        }
        if (!mutationQueue.length) {
          updateActivityIndicator_();
          return;
        }

        var item = mutationQueue[0];
        mutationInFlight = true;
        updateActivityIndicator_();

        function rebaseAfterFailure_() {
          rollbackPendingMutations_();
          mutationQueue.shift();
          replayPendingMutations_();
          mutationInFlight = false;
          if (state) renderPreservingCellEditor_();
        }

        function completeFailure_(message, error, requireRefresh) {
          rebaseAfterFailure_();
          if (error) console.error(error);
          setNotice(message || "保存できませんでした。", "error");
          if (requireRefresh) {
            refreshBarrierRequested = true;
            refreshBarrierPreserveNotice = true;
            refreshBarrierBlocked = false;
          }
          updateActivityIndicator_();
          processMutationQueue_();
        }

        var runner = makeRunner(function(result) {
          if (!result || result.ok !== true) {
            completeFailure_(result && result.message ? result.message : "保存できませんでした。", null, true);
            return;
          }
          mutationQueue.shift();
          mutationInFlight = false;
          markDraftSaveSucceeded_(item);
          if (state) state.lastAction = getCurrentActionLabel();
          setNotice(mutationSuccessMessage_(item, result.data), "success");
          if (item.refreshAfterSuccess) {
            refreshBarrierRequested = true;
            refreshBarrierPreserveNotice = true;
            refreshBarrierBlocked = false;
          }
          updateActivityIndicator_();
          processMutationQueue_();
        }, function(error) {
          completeFailure_("処理結果を確認できなかったため、最新状態を再取得してから後続の更新を送信します。", error, true);
        });

        try {
          dispatch(runner, item.method, item.payload);
        } catch (error) {
          completeFailure_("処理を開始できませんでした。ページを再読み込みしてください。", error, false);
        }
      }

      function getCurrentActionLabel() {
        var parts = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Asia/Tokyo",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).formatToParts(new Date());
        var values = {};
        parts.forEach(function(part) { values[part.type] = part.value; });
        return values.year + "/" + values.month + "/" + values.day + " " + values.hour + ":" + values.minute;
      }

      function createDrafts(data) {
        return {
          settings: {
            startDate: data.settings.startDate,
            endDate: data.settings.endDate,
            intervalDays: String(data.settings.intervalDays),
            holidays: data.settings.holidays.join("\n")
          },
          employees: data.employees.map(function(item) { return { name: item.name, group: item.group, must: item.must }; }),
          jobs: data.jobs.slice(),
          categories: data.categories.map(function(item) { return { job: item.job, category: item.category }; }),
          quotas: data.quotas.map(function(item) { return { workDays: item.workDays, primary: item.primary, secondary: item.secondary }; })
        };
      }

      function formatPeriod(start, end) {
        if (!start || !end) return "期間未設定";
        return start + " 〜 " + end;
      }

      function render() {
        if (!state) return;
        main.dataset.page = activePage;
        document.querySelectorAll(".bottom-nav button").forEach(function(button) {
          var active = button.dataset.page === activePage;
          button.classList.toggle("active", active);
          if (active) button.setAttribute("aria-current", "page");
          else button.removeAttribute("aria-current");
        });
        if (activePage === "shift") renderShift();
        else if (activePage === "settings") renderSettings();
        else renderInfo();
      }

      function renderHeading(title, subtitle) {
        var heading = element("div", "page-heading");
        heading.appendChild(element("h2", "", title));
        if (subtitle) heading.appendChild(element("p", "", subtitle));
        return heading;
      }

      function renderShift() {
        main.replaceChildren();
        main.appendChild(renderHeading("一覧表", "対象期間全体のシフトを確認・編集できます。"));
        main.appendChild(renderFixedHistoryActions());
        var jobs = [{ value: "", label: "未設定" }, { value: "休", label: "休" }];
        state.jobs.forEach(function(job) { jobs.push({ value: job, label: job }); });
        renderShiftTable(jobs);
      }

      function renderShiftTable(jobs) {
        var rows = state.shift.rows || [];
        var dates = state.shift.dates || [];
        var selectedRow = null;
        var selectedDateIndex = -1;
        if (selectedGridCell) {
          selectedRow = rows.find(function(row) { return row.name === selectedGridCell.employeeName; }) || null;
          selectedDateIndex = dates.findIndex(function(dateInfo) { return dateInfo.iso === selectedGridCell.date; });
          if (!selectedRow || selectedDateIndex < 0) {
            selectedGridCell = null;
            selectedRow = null;
          }
        }

        var toolbar = element("div", "table-toolbar");
        var toolbarInfo = element("div", "table-toolbar-info");
        toolbarInfo.appendChild(element("h3", "", "シフト表"));
        var periodStart = dates.length ? dates[0].iso : state.settings.startDate;
        var periodEnd = dates.length ? dates[dates.length - 1].iso : state.settings.endDate;
        toolbarInfo.appendChild(element("span", "table-period", (periodStart || "") + " — " + (periodEnd || "")));
        toolbar.appendChild(toolbarInfo);

        var toolbarActions = element("div", "table-toolbar-actions");
        toolbarActions.appendChild(makeButton("シフト表を生成", "primary", function() {
          runMutation("apiGenerateShift", undefined, "シフト生成が完了しました。警告を確認してください。", "シフト生成中…");
        }));
        toolbarActions.appendChild(makeButton("印刷", "secondary", function() { window.print(); }));
        var templates = document.createElement("details");
        templates.className = "template-actions";
        var summary = document.createElement("summary");
        summary.textContent = "ひな形";
        templates.appendChild(summary);
        var templateActions = element("div", "template-actions-list");
        templateActions.appendChild(makeButton("シフト表のひな形", "small", function() {
          if (window.confirm("現在のシフト表を既存の固定セルを残してひな形に更新します。続けますか？")) {
            runMutation("apiPrepareShiftTemplate", undefined, "シフト表ひな形を更新しました。", "シフト表ひな形を更新中…");
          }
        }));
        templateActions.appendChild(makeButton("回数設定のひな形", "small", function() {
          runMutation("apiPrepareQuotaTemplate", undefined, "回数設定ひな形を更新しました。", "回数設定ひな形を更新中…");
        }));
        templates.appendChild(templateActions);
        toolbarActions.appendChild(templates);
        toolbar.appendChild(toolbarActions);
        main.appendChild(toolbar);

        if (!rows.length || !dates.length) {
          main.appendChild(element("div", "empty", "表示できるシフト表がありません。ひな形と設定を確認してください。"));
          return;
        }

        main.appendChild(element("p", "muted grid-help", "全日付を一画面に表示します。セルを選ぶと編集シートが開きます。"));
        var scroll = element("div", "shift-grid-scroll");
        scroll.setAttribute("role", "region");
        scroll.setAttribute("aria-label", "対象期間全体のシフト表。横スクロールなしで全日付を表示します。セルを選ぶと編集できます。");
        scroll.tabIndex = 0;

      function vacationDatesForRequest_(item) {
        var raw = String(item && item.vacationDates || "").trim();
        if (!raw) return [];
        var fallbackYear = Number(String(state.settings.startDate || "").slice(0, 4)) || new Date().getFullYear();
        var uniqueDates = new Map();
        raw.split(/[,，、;；\n]+/).forEach(function(token) {
          var label = token.trim();
          if (!label) return;
          var value = label.replace(/\s*[（(][^）)]*[）)]\s*$/, "").trim();
          var year = fallbackYear;
          var month;
          var day;
          var fullDate = /^(\d{4})\s*(?:[-/.年])\s*(\d{1,2})\s*(?:[-/.月])\s*(\d{1,2})\s*日?$/.exec(value);
          var monthDay = /^(\d{1,2})\s*(?:\/|月)\s*(\d{1,2})\s*日?$/.exec(value);
          if (fullDate) {
            year = Number(fullDate[1]);
            month = Number(fullDate[2]);
            day = Number(fullDate[3]);
          } else if (monthDay) {
            month = Number(monthDay[1]);
            day = Number(monthDay[2]);
          } else {
            return;
          }
          var date = new Date(year, month - 1, day);
          if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return;
          var iso = String(year).padStart(4, "0") + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0");
          if (!uniqueDates.has(iso)) uniqueDates.set(iso, { iso: iso, label: label });
        });
        return Array.from(uniqueDates.values()).sort(function(left, right) { return left.iso.localeCompare(right.iso); });
      }

      function monthLabel_(monthKey) {
        var parts = monthKey.split("-");
        return Number(parts[0]) + "年" + Number(parts[1]) + "月";
      }

      function requestMonthOptions_(requestRows) {
        var months = new Set();
        (state.shift.dates || []).forEach(function(date) { months.add(date.iso.slice(0, 7)); });
        requestRows.forEach(function(row) {
          row.dates.forEach(function(date) { months.add(date.iso.slice(0, 7)); });
        });
        return Array.from(months).filter(function(value) { return /^\d{4}-\d{2}$/.test(value); }).sort();
      }

      function renderInfo() {
        main.replaceChildren();
        main.appendChild(renderHeading("希望・警告", "フォーム回答は閲覧のみです。Webアプリから回答内容は変更できません。"));
        var toggle = element("div", "segmented");
        var requestTab = element("button", infoMode === "requests" ? "active" : "", "休暇希望");
        var warningTab = element("button", infoMode === "warnings" ? "active" : "", "警告（" + state.warnings.length + "）");
        requestTab.type = warningTab.type = "button";
        requestTab.dataset.infoMode = "requests";
        warningTab.dataset.infoMode = "warnings";
        requestTab.setAttribute("aria-pressed", infoMode === "requests" ? "true" : "false");
        warningTab.setAttribute("aria-pressed", infoMode === "warnings" ? "true" : "false");
        requestTab.addEventListener("click", function() { switchInfoMode("requests"); });
        warningTab.addEventListener("click", function() { switchInfoMode("warnings"); });
        toggle.appendChild(requestTab);
        toggle.appendChild(warningTab);
        main.appendChild(toggle);

        if (infoMode === "requests") {
          var requestRows = (state.formRequests || []).map(function(item) {
            return { item: item, dates: vacationDatesForRequest_(item) };
          });
          var requestMonths = requestMonthOptions_(requestRows);
          if (selectedRequestMonth && requestMonths.indexOf(selectedRequestMonth) < 0) selectedRequestMonth = "";
          var monthOptions = [{ value: "", label: "すべての月" }].concat(requestMonths.map(function(month) {
            return { value: month, label: monthLabel_(month) };
          }));
          var monthSelect = selectControl(monthOptions, selectedRequestMonth);
          monthSelect.id = "request-month-filter";
          monthSelect.setAttribute("aria-label", "休暇希望を表示する月");
          monthSelect.addEventListener("change", function() {
            selectedRequestMonth = monthSelect.value;
            renderInfo();
            var nextMonthSelect = document.getElementById("request-month-filter");
            if (nextMonthSelect) nextMonthSelect.focus();
          });
          var filters = element("div", "filters info-filters");
          filters.appendChild(field("表示する月", monthSelect));
          main.appendChild(filters);

          var visibleRequests = requestRows.filter(function(row) {
            return !selectedRequestMonth || row.dates.some(function(date) { return date.iso.slice(0, 7) === selectedRequestMonth; });
          });
          var subtitle = selectedRequestMonth ? monthLabel_(selectedRequestMonth) + "の希望日を表示しています。" : "直近100件の回答です。";
          var requestsCard = card("フォーム回答（" + visibleRequests.length + "件）", subtitle);
          if (!visibleRequests.length) {
            requestsCard.appendChild(element("div", "empty", selectedRequestMonth ? "この月の休暇希望はありません。" : "休暇希望はありません。"));
          }
          visibleRequests.forEach(function(request) {
            var item = request.item;
            var visibleDates = selectedRequestMonth ? request.dates.filter(function(date) {
              return date.iso.slice(0, 7) === selectedRequestMonth;
            }) : request.dates;
            var vacationText = selectedRequestMonth ? visibleDates.map(function(date) { return date.label; }).join("、") : (item.vacationDates || "未入力");
            var row = element("div", "request-row");
            row.appendChild(element("strong", "", item.name || "氏名未入力"));
            row.appendChild(element("div", "request-meta", "希望日: " + (vacationText || "未入力")));
            if (item.timestamp) row.appendChild(element("div", "request-meta", item.timestamp));
            requestsCard.appendChild(row);
          });
          main.appendChild(requestsCard);
        } else {
          var warningsCard = card("生成時の警告");
          if (!state.warnings.length) warningsCard.appendChild(element("div", "empty", "警告はありません。"));
          state.warnings.forEach(function(item) {
            var row = element("div", "warning-row");
            row.appendChild(element("div", "warning-date", item.date || "全体"));
            row.appendChild(element("div", "", item.message));
            warningsCard.appendChild(row);
          });
          main.appendChild(warningsCard);
        }
      }

      function switchInfoMode(mode) {
        infoMode = mode;
        render();
        var activeMode = main.querySelector('[data-info-mode="' + mode + '"]');
        if (activeMode) activeMode.focus();
      }

      document.querySelectorAll(".bottom-nav button").forEach(function(button) {
        button.addEventListener("click", function() {
          activePage = button.dataset.page;
          selectedGridCell = null;
          render();
        });
      });
      document.getElementById("refresh-button").addEventListener("click", function() { loadState(false); });
      loadState(false);
    </script>
  </body>
</html>
